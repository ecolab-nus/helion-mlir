[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helion-mlir"
version = "0.1.0"
description = "Helion-to-MLIR lowering utilities"
requires-python = ">=3.10"
dependencies = [
    "triton==3.6.0",
    "helion==0.2.10",
    "tabulate==0.9.0",
    "torch-mlir",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
