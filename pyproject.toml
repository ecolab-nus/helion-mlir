[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helion-mlir"
version = "0.1.0"
description = "Helion-to-MLIR lowering utilities"
requires-python = ">=3.10,<3.11"
dependencies = [
    "triton==3.6.0",
    "helion==0.2.10",
    "tabulate==0.9.0",
    "torch-mlir>=20260122.700",
    "torch==2.10.0+cu130",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torch-mlir = { index = "torch-mlir-dev-wheels" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "torch-mlir-dev-wheels"
url = "https://github.com/llvm/torch-mlir-release/releases/expanded_assets/dev-wheels"
format = "flat"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
